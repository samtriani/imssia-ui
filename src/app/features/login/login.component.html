<div class="login-screen" (keydown)="onKeyEnter($event)">
  <div class="login-bg login-bg--1"></div>
  <div class="login-bg login-bg--2"></div>

  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">🏥</div>
      <div>
        <div class="login-brand">IMSS <span>AI</span></div>
        <div class="login-tagline">Plataforma de Atención Médica Inteligente</div>
      </div>
    </div>

    <div class="login-divider"></div>

    <div class="login-error" *ngIf="error">
      <span>⚠</span> {{ error }}
    </div>

    <div class="form-group">
      <label class="form-label" for="mat">Matrícula del médico</label>
      <input
        id="mat"
        class="form-input"
        type="text"
        [(ngModel)]="matricula"
        placeholder="Ej. 311095641"
        autocomplete="off"
        [disabled]="loading"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="pwd">Contraseña</label>
      <input
        id="pwd"
        class="form-input"
        type="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        [disabled]="loading"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="esp">Especialidad</label>
      <select
        id="esp"
        class="form-select"
        [(ngModel)]="cveEspecialidad"
        [disabled]="loading"
      >
        <option *ngFor="let e of especialidades" [value]="e.cve">{{ e.des }}</option>
      </select>
    </div>

    <button class="login-btn" (click)="onLogin()" [disabled]="loading">
      <span *ngIf="!loading">Iniciar sesión</span>
      <span *ngIf="loading" class="spinner"></span>
    </button>

    <p class="login-footer">© Instituto Mexicano del Seguro Social</p>
  </div>
</div>
